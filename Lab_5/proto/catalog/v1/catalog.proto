syntax = "proto3";

package nursery.catalog.v1;
option go_package = "plant-nursery/proto/catalog/v1;catalogv1";

service CatalogService {
  rpc CreatePlant(CreatePlantRequest) returns (Plant);
  rpc GetPlant(GetPlantRequest) returns (Plant);
  rpc ListPlants(ListPlantsRequest) returns (ListPlantsResponse);
  rpc UpdatePlant(UpdatePlantRequest) returns (Plant);
  rpc DeletePlant(DeletePlantRequest) returns (DeletePlantResponse);
}

message Plant {
  string id = 1;
  string name = 2;
  string species = 3;
  int64 price_cents = 4;
  int32 stock = 5;
  string created_at = 6; // RFC 3339
}

message CreatePlantRequest {
  string name = 1;
  string species = 2;
  int64 price_cents = 3;
  int32 stock = 4;
}
message GetPlantRequest { string id = 1; }
message ListPlantsRequest {}
message ListPlantsResponse { repeated Plant plants = 1; }
message UpdatePlantRequest {
  string id = 1;
  string name = 2;
  string species = 3;
  int64 price_cents = 4;
  int32 stock = 5;
}
message DeletePlantRequest { string id = 1; }
message DeletePlantResponse {}