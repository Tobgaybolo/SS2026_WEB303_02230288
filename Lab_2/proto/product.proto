syntax = "proto3";

package product;

option go_package = "Lab_2/proto;proto";   // package name becomes "proto"

service ProductService {
  rpc GetProduct (GetProductRequest) returns (Product);
}

message GetProductRequest {
  string product_id = 1;
}

message Product {
  string product_id = 1;
  string name = 2;
  double price = 3;
}