name: plant-nursery

services:
  # ---------- Catalog (Service B) and its own database ----------
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: ${CATALOG_DB_NAME}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - catalog-db-net

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      GRPC_PORT: ${CATALOG_GRPC_PORT}
      DB_HOST: catalog-db
      DB_PORT: ${DB_PORT}
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      DB_NAME: ${CATALOG_DB_NAME}
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - catalog-db-net
      - services-net

  # ---------- Purchase (Service A) and its own database ----------
  purchases-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PURCHASE_DB_USER}
      POSTGRES_PASSWORD: ${PURCHASE_DB_PASSWORD}
      POSTGRES_DB: ${PURCHASE_DB_NAME}
    volumes:
      - purchases-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - purchases-db-net

  purchase-service:
    build:
      context: .
      dockerfile: purchase-service/Dockerfile
    environment:
      GRPC_PORT: ${PURCHASE_GRPC_PORT}
      DB_HOST: purchases-db
      DB_PORT: ${DB_PORT}
      DB_USER: ${PURCHASE_DB_USER}
      DB_PASSWORD: ${PURCHASE_DB_PASSWORD}
      DB_NAME: ${PURCHASE_DB_NAME}
      CATALOG_ADDR: catalog-service:${CATALOG_GRPC_PORT}
      CATALOG_TIMEOUT: ${CATALOG_TIMEOUT}
      CATALOG_MAX_ATTEMPTS: ${CATALOG_MAX_ATTEMPTS}
      CATALOG_RETRY_BASE: ${CATALOG_RETRY_BASE}
      CATALOG_BREAKER_THRESHOLD: ${CATALOG_BREAKER_THRESHOLD}
      CATALOG_BREAKER_OPEN_TIMEOUT: ${CATALOG_BREAKER_OPEN_TIMEOUT}
    depends_on:
      purchases-db:
        condition: service_healthy
    networks:
      - purchases-db-net
      - services-net

  # ---------- API Gateway: the only thing published to the host ----------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      CATALOG_ADDR: catalog-service:${CATALOG_GRPC_PORT}
      PURCHASE_ADDR: purchase-service:${PURCHASE_GRPC_PORT}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT}
    depends_on:
      - catalog-service
      - purchase-service
    networks:
      - services-net

# A database is reachable only from its own service.
networks:
  catalog-db-net:
  purchases-db-net:
  services-net:

volumes:
  catalog-db-data:
  purchases-db-data: